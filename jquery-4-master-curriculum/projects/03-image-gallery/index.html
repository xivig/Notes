<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 03: Image Gallery & Lightbox</title>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .gallery-container { max-width: 800px; margin: 0 auto; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 1.5rem; }
    .thumb-card { overflow: hidden; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; position: relative; background: #1e293b; }
    .thumb-card:hover { transform: translateY(-4px); border-color: #38bdf8; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
    .thumb-img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .thumb-caption { padding: 8px; font-size: 13px; color: #cbd5e1; }
    
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
    .lightbox-img { max-width: 85%; max-height: 75vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .lightbox-nav { position: absolute; width: 95%; display: flex; justify-content: space-between; }
    .nav-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 32px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .nav-btn:hover { background: rgba(255,255,255,0.3); }
    .caption { margin-top: 15px; font-size: 16px; color: #94a3b8; }
    .close-btn { position: absolute; top: 20px; right: 25px; font-size: 30px; background: none; border: none; color: #cbd5e1; cursor: pointer; }
    .close-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="gallery-container">
    <h2>Natural Wonders Gallery</h2>
    <p style="color:#94a3b8;">Click any photo for an enlarged interactive lightbox view with keyboard navigation.</p>
    
    <div class="grid" id="galleryGrid">
      <div class="thumb-card" data-full="https://picsum.photos/id/10/1200/800" data-caption="Forest Mist in Morning Light">
        <img src="https://picsum.photos/id/10/400/250" class="thumb-img" alt="Forest Mist">
        <div class="thumb-caption">Forest Mist</div>
      </div>
      <div class="thumb-card" data-full="https://picsum.photos/id/15/1200/800" data-caption="Rushing Waterfall Cascade">
        <img src="https://picsum.photos/id/15/400/250" class="thumb-img" alt="Waterfall Cascade">
        <div class="thumb-caption">Waterfall Cascade</div>
      </div>
      <div class="thumb-card" data-full="https://picsum.photos/id/28/1200/800" data-caption="Alpine Pine Forest and Peaks">
        <img src="https://picsum.photos/id/28/400/250" class="thumb-img" alt="Alpine Peaks">
        <div class="thumb-caption">Alpine Peaks</div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="close-btn" id="btnCloseLightbox">✕</button>
    <div class="lightbox-nav">
      <button class="nav-btn" id="btnPrev">❮</button>
      <button class="nav-btn" id="btnNext">❯</button>
    </div>
    <img id="lightboxImage" class="lightbox-img" src="" alt="Enlarged photo">
    <div class="caption" id="lightboxCaption"></div>
  </div>

  <script>
    $(function() {
      const $cards = $('.thumb-card');
      let activeIndex = 0;

      function renderLightbox(index) {
        activeIndex = (index + $cards.length) % $cards.length;
        const $activeCard = $cards.eq(activeIndex);

        $('#lightboxImage').attr('src', $activeCard.data('full'));
        $('#lightboxCaption').text($activeCard.data('caption'));
      }

      $cards.on('click', function() {
        activeIndex = $(this).index();
        renderLightbox(activeIndex);
        $('#lightbox').css('display', 'flex').hide().fadeIn(200);
      });

      $('#btnNext').on('click', () => renderLightbox(activeIndex + 1));
      $('#btnPrev').on('click', () => renderLightbox(activeIndex - 1));
      $('#btnCloseLightbox').on('click', () => $('#lightbox').fadeOut(200));

      // Dismiss on backdrop click
      $('#lightbox').on('click', function(e) {
        if ($(e.target).is('#lightbox')) $(this).fadeOut(200);
      });

      // Keyboard Controls
      $(document).on('keydown', function(e) {
        if (!$('#lightbox').is(':visible')) return;
        if (e.key === 'ArrowRight') renderLightbox(activeIndex + 1);
        if (e.key === 'ArrowLeft') renderLightbox(activeIndex - 1);
        if (e.key === 'Escape') $('#lightbox').fadeOut(200);
      });
    });
  </script>
</body>
</html>
