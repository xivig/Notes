<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 06: Full AJAX CRUD Application</title>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 2rem; color: #1e293b; }
    .crud-wrapper { max-width: 500px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .task-form { display: flex; gap: 8px; margin-bottom: 20px; }
    .task-form input { flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
    .task-form button { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .task-list { list-style: none; padding: 0; margin: 0; }
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; background: #fff; transition: background 0.2s; }
    .task-item:hover { background: #f8fafc; }
    .task-title { cursor: pointer; flex: 1; }
    .task-title.completed { text-decoration: line-through; color: #94a3b8; }
    .btn-delete { border: none; background: #fee2e2; color: #dc2626; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .status-msg { font-size: 12px; color: #64748b; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="crud-wrapper">
    <h2>REST Task Manager (CRUD)</h2>
    <form id="createForm" class="task-form">
      <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
      <button type="submit">Add Task</button>
    </form>

    <ul class="task-list" id="taskList">
      <li style="text-align:center; padding:20px; color:#64748b;">Loading tasks from REST API...</li>
    </ul>

    <div class="status-msg" id="statusMessage">Syncing with remote API...</div>
  </div>

  <script>
    $(function() {
      const API_URL = 'https://jsonplaceholder.typicode.com/todos';

      // 1. READ: Fetch tasks from API
      function fetchTasks() {
        $.getJSON(API_URL + '?_limit=4')
          .done(function(tasks) {
            const html = tasks.map(t => `
              <li class="task-item" data-id="${t.id}">
                <span class="task-title ${t.completed ? 'completed' : ''}">${t.title}</span>
                <button class="btn-delete">Delete</button>
              </li>
            `).join('');
            $('#taskList').html(html);
            $('#statusMessage').text('✓ Tasks synchronized.');
          })
          .fail(function() {
            $('#taskList').html('<li style="color:red; text-align:center;">Failed to load tasks.</li>');
          });
      }

      // 2. CREATE: Add new task (POST)
      $('#createForm').on('submit', function(e) {
        e.preventDefault();
        const title = $('#taskTitle').val().trim();
        if (!title) return;

        $('#statusMessage').text('Creating task...');

        $.ajax({
          url: API_URL,
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ title: title, completed: false, userId: 1 })
        })
        .done(function(createdTask) {
          $('#taskList').prepend(`
            <li class="task-item" data-id="${createdTask.id}">
              <span class="task-title">${createdTask.title}</span>
              <button class="btn-delete">Delete</button>
            </li>
          `);
          $('#taskTitle').val('').focus();
          $('#statusMessage').text(`✓ Created task #${createdTask.id}`);
        });
      });

      // 3. UPDATE: Toggle completion (PATCH)
      $('#taskList').on('click', '.task-title', function() {
        const $title = $(this);
        const $item = $title.closest('.task-item');
        const id = $item.data('id');
        const isDone = $title.hasClass('completed');

        $('#statusMessage').text('Updating status...');

        $.ajax({
          url: `${API_URL}/${id}`,
          method: 'PATCH',
          contentType: 'application/json',
          data: JSON.stringify({ completed: !isDone })
        })
        .done(function() {
          $title.toggleClass('completed');
          $('#statusMessage').text(`✓ Task #${id} status updated.`);
        });
      });

      // 4. DELETE: Remove task (DELETE)
      $('#taskList').on('click', '.btn-delete', function() {
        const $item = $(this).closest('.task-item');
        const id = $item.data('id');

        $('#statusMessage').text(`Deleting task #${id}...`);

        $.ajax({
          url: `${API_URL}/${id}`,
          method: 'DELETE'
        })
        .done(function() {
          $item.fadeOut(200, function() {
            $(this).remove();
            $('#statusMessage').text(`✓ Task #${id} deleted.`);
          });
        });
      });

      fetchTasks();
    });
  </script>
</body>
</html>
